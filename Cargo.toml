[workspace]
members = [
    "crates/lava-accel",
    "crates/lava-lsp",
    "crates/lava-remote",
    "crates/lava-term",
    "crates/lava-proto",
    "crates/lava-gtk",
    "crates/lava-vm",
    "crates/lava-cli",
    "crates/lava-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
libc = "0.2"
pkg-config = "0.3"
driver = { git = "https://github.com/Finlifin/nessa.git", branch = "main" }
gc = { git = "https://github.com/Finlifin/nessa.git", branch = "main" }
initialization = { git = "https://github.com/Finlifin/nessa.git", branch = "main" }
interpreter = { git = "https://github.com/Finlifin/nessa.git", branch = "main" }
nsbc = { git = "https://github.com/Finlifin/nessa.git", branch = "main" }
nsbc_io = { git = "https://github.com/Finlifin/nessa.git", branch = "main" }
pkg_manager = { git = "https://github.com/Finlifin/nessa.git", branch = "main" }
runtime = { git = "https://github.com/Finlifin/nessa.git", branch = "main" }
scheduler = { git = "https://github.com/Finlifin/nessa.git", branch = "main" }
lava-accel = { path = "crates/lava-accel" }
lava-lsp = { path = "crates/lava-lsp" }
lava-remote = { path = "crates/lava-remote" }
lava-term = { path = "crates/lava-term" }
lava-proto = { path = "crates/lava-proto" }
lava-gtk = { path = "crates/lava-gtk" }
lava-vm = { path = "crates/lava-vm" }

[profile.dev]
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.lava-accel]
opt-level = 2

[profile.test]
debug = 0
incremental = false

[profile.test.package."*"]
opt-level = 2

[profile.test.package.lava-accel]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
