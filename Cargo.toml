[workspace]
members = [
    "crates/lava-accel",
    "crates/lava-lsp",
    "crates/lava-remote",
    "crates/lava-term",
    "crates/lava-proto",
    "crates/lava-gtk",
    "crates/lava-vm",
    "crates/lava-cli",
    "crates/lava-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
libc = "0.2"
pkg-config = "0.3"
driver = { path = "/home/fin/nessa/nessa2/engine/driver" }
gc = { path = "/home/fin/nessa/nessa2/engine/gc" }
initialization = { path = "/home/fin/nessa/nessa2/engine/initialization" }
interpreter = { path = "/home/fin/nessa/nessa2/engine/interpreter" }
nsbc = { path = "/home/fin/nessa/nessa2/engine/nsbc" }
nsbc_io = { path = "/home/fin/nessa/nessa2/engine/nsbc_io" }
pkg_manager = { path = "/home/fin/nessa/nessa2/engine/pkg_manager" }
runtime = { path = "/home/fin/nessa/nessa2/engine/runtime" }
lava-accel = { path = "crates/lava-accel" }
lava-lsp = { path = "crates/lava-lsp" }
lava-remote = { path = "crates/lava-remote" }
lava-term = { path = "crates/lava-term" }
lava-proto = { path = "crates/lava-proto" }
lava-gtk = { path = "crates/lava-gtk" }
lava-vm = { path = "crates/lava-vm" }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
